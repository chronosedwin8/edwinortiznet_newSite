# edwinortiz.net — Nginx + PHP-FPM (equivalente a public/.htaccess)
# Ajusta /var/www/edwinortiz y el socket de PHP-FPM a tu servidor.

# HTTP → HTTPS y sin www → con www
server {
    listen 80;
    listen [::]:80;
    server_name edwinortiz.net www.edwinortiz.net;
    return 301 https://www.edwinortiz.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name edwinortiz.net;
    ssl_certificate     /etc/letsencrypt/live/www.edwinortiz.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.edwinortiz.net/privkey.pem;
    return 301 https://www.edwinortiz.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.edwinortiz.net;

    ssl_certificate     /etc/letsencrypt/live/www.edwinortiz.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.edwinortiz.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Solo public/ es raíz web: .env, storage/, src/ y vendor/ quedan fuera.
    root /var/www/edwinortiz/public;
    index index.php;
    charset utf-8;
    client_max_body_size 210m;   # subida de archivos de producto desde el panel

    # Compresión
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Archivos ocultos
    location ~ /\.(?!well-known) { deny all; }

    # Recursos estáticos versionados (?v=…): caché larga
    location ~* \.(?:css|js|mjs|woff2|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
        access_log off;
    }
    location ~* \.(?:png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        access_log off;
    }

    # Descargas protegidas: solo accesibles vía X-Accel-Redirect desde PHP (DOWNLOAD_ACCEL=true en .env)
    location /protected-downloads/ {
        internal;
        alias /var/www/edwinortiz/storage/downloads/;
        add_header Cache-Control "private, no-store";
        add_header X-Robots-Tag "noindex";
    }

    # Front controller único
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Cualquier otro .php no se ejecuta
    location ~ \.php$ { return 404; }
}
